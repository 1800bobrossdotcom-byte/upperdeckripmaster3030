<!-- HERO LENS — authoring template.
     Copy this, rename to "NN - YOUR TITLE.html", drop it in the repo root, then:
         node scripts/build-hero-lens.mjs --apply
     which wraps it into cards/hero/NN.html — the page the token's animation_url frames.

     THE CONTRACT (what the wrapper guarantees, and what it needs back)

     You get   a 2:3 card-shaped box that already scales to whatever frames it, and a
               corner mark with the number + title. Your markup is dropped in whole,
               absolutely positioned to fill the card. Style it however you like.

     You must  stay SELF-CONTAINED. This page loads inside a sandboxed iframe at an
               opaque origin on someone else's site:
                 · no external requests — no CDN, no Google Fonts, no remote images.
                   Inline your CSS/JS here; base64 any small asset you need.
                 · no localStorage / sessionStorage — it THROWS at an opaque origin.
                   Wrap any storage access in try/catch or just don't use it.
                 · no window.parent / window.top access — cross-origin, it will throw.
                 · no assumption of a wallet. window.ethereum is not injected into a
                   sandboxed frame. If a card wants chain data, fetch a public RPC.
                 · size in %, vh/vw or em — never fixed px. The card is ~300px wide in
                   a phone's media slot and ~900px on a desktop.
                 · autoplay audio will be blocked. Muted video/CSS animation is fine.

     Test it the way SuperRare will:  open cards/hero/NN.html directly, then open it in a
     sandboxed iframe, then at 320px wide. If it survives all three it will survive the
     media slot.

     ── TWO OPT-IN POWERS, both proven in cards/lens3d.html ────────────────────────────────

     1. DEPTH. A card built from separated plates — backing / mid / subject / FX / foil — that
        slide against each other as it turns. Describe them in a sidecar next to the art,
        `<art>.layers.json`, schema in js/card-layers.js:

          { "v":1, "layers":[
              {"id":"bg",     "src":"34.bg.webp",     "z":0.00, "fit":"full"},
              {"id":"subject","src":"34.subject.webp","z":0.62, "relief":1.0},
              {"id":"foil",   "src":"34.foil.webp",   "z":1.00, "blend":"add", "foil":true,
                              "drive":{"gain":"price","min":0.05,"max":0.15}} ]}

        `z` is 0..1 through the card's thickness; `blend` is "normal" or "add"; `drive` ties a
        layer's brightness to a live market dial. ⛔ Layers must be AUTHORED as separate images
        — do not key a background out of a finished piece and call the two halves layers.
        No sidecar = a single flat plate, which is correct and is what every card does today.
        Worked reference, five real plates: media/lens/demo/ (npm-less:
        `node scripts/build-lens-demo.mjs`).

     2. LIVE STATE. The $3030 edition's own market — burn progress, price, liquidity — read
        over a public RPC and handed to you as three 0..1 dials. js/lens-state.js.

     ⚑ Both need a <script src> to OUR OWN HOST, which the "no external requests" rule above
       does not forbid and which is measured to work: the engine, the helpers and the RPC all
       load inside a sandboxed frame at an opaque origin (that is exactly what lens3d.html was
       built to find out). What the rule forbids is a THIRD-PARTY request — a CDN, a webfont, a
       remote image — because that is a dependency on somebody else's uptime and privacy policy
       inside a frame you do not control.
     ⛔ AND NEVER A WALLET, not behind a click or a flag. `eth_call` over fetch shows state and
       cannot move anything; a frame that asks for a wallet is indistinguishable from one that
       has been swapped for a malicious frame. SuperRare's security team flagged this once
       already and they were right.
     ⚠ Wire it so the card is finished WITHOUT it. Both scripts can be blocked, and the dials
       rest at burn 0 / price 0.5 / depth 0.5 when they are — pick your resting look first, then
       let the market move it. -->

<!-- OPTIONAL — delete these two lines if your card does not read the market.
     They fail silently: blocked, offline or 404, `window.LensState` is simply never defined. -->
<script src="../../js/chain-config.js" onerror="void 0"></script>
<script src="../../js/lens-state.js" onerror="void 0"></script>

<style>
  /* everything scoped inside the card — the wrapper owns html/body */
  .t-sky   { position:absolute; inset:0; background:
               radial-gradient(120% 80% at 50% 0%, #1b0b2e 0%, #08040f 60%, #000 100%); }
  .t-grid  { position:absolute; inset:0; opacity:.35;
             background-image:linear-gradient(#2bff8033 1px,transparent 1px),
                              linear-gradient(90deg,#2bff8033 1px,transparent 1px);
             background-size:8% 8%; animation:t-drift 12s linear infinite; }
  @keyframes t-drift { to { background-position:0 8%, 8% 0; } }
  .t-orb   { position:absolute; left:50%; top:38%; width:38%; aspect-ratio:1;
             transform:translate(-50%,-50%); border-radius:50%;
             background:radial-gradient(circle at 34% 30%, #fff 0%, #ffd23b 22%, #ff3ba6 62%, #2a0a3f 100%);
             box-shadow:0 0 8% 2% #ff3ba655; animation:t-bob 6s ease-in-out infinite; }
  @keyframes t-bob { 50% { transform:translate(-50%,-58%) scale(1.04); } }
  .t-word  { position:absolute; left:0; right:0; bottom:14%; text-align:center;
             font:700 7cqw/1.1 'Arial Black',Arial,sans-serif; letter-spacing:.04em;
             color:#eaffe9; text-shadow:0 0 3% #2bff80; mix-blend-mode:screen; }
  .t-sub   { position:absolute; left:0; right:0; bottom:9%; text-align:center;
             font:3.4cqw/1.3 ui-monospace,'Courier New',monospace; color:#8fe6bd; }
  /* cqw needs a container — the wrapper's .card is the nearest sized box */
  .body    { container-type:size; }
  @supports not (width:1cqw){ .t-word{font-size:7vw} .t-sub{font-size:3.4vw} }
</style>

<div class="t-sky"></div>
<div class="t-grid"></div>
<div class="t-orb"></div>
<div class="t-word">YOUR CARD</div>
<div class="t-sub">a card that runs</div>

<script>
  // Optional. If you use JS at all, fail soft — a thrown error in the media slot is a
  // blank card, and nobody will ever see the console.
  try {
    var orb = document.querySelector('.t-orb');
    if (orb) document.addEventListener('pointermove', function (e) {
      var r = document.body.getBoundingClientRect();
      orb.style.left = (38 + (e.clientX / r.width) * 24) + '%';
    }, { passive: true });
  } catch (e) {}

  /* ── LIVE MARKET STATE (optional) ───────────────────────────────────────────────────────
   * Three dials, each 0..1, published as CSS custom properties so the card can be styled
   * entirely in CSS and still move with the market:
   *     --burn   permanent supply destroyed, against the whole planned pack programme.
   *              ABSOLUTE — it needs no reference, so hang your loudest change on it.
   *     --price  relative to this session's first read (0.5 = unchanged, 1.0 = 2x).
   *     --depth  market liquidity, same convention. 0 means an empty book.
   * The `.live` class only ever appears when a read actually succeeded, so `:not(.live)` is
   * where the resting card lives. Style THAT first — it is what ships in a blocked frame.
   *
   * ⚠ Pull-based, and slow on purpose (60 s, paused while the tab is hidden). SuperRare's own
   *   note: "a render contract is not a background process… the market changes on-chain,
   *   metadata gets refetched, and the artwork changes." Do not poll a free RPC harder. */
  try {
    if (window.LensState) LensState.watch(function (state, d) {
      var s = document.documentElement.style;
      s.setProperty('--burn',  d.burn.toFixed(4));
      s.setProperty('--price', d.price.toFixed(4));
      s.setProperty('--depth', d.depth.toFixed(4));
      document.body.classList.toggle('live', !!d.live);
      // e.g. document.querySelector('.t-orb').style.filter =
      //        'brightness(' + (0.85 + 0.5 * d.burn) + ')';
    }, { every: 60000 });
  } catch (e) {}
</script>
