<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D CARD LENS — test</title>
<!--
  upperdeckripmaster3030 — DYNAMIC 3D CARD, proof of concept.
  cards/lens3d.html?card=<slug>          (defaults to a test card)

  WHAT THIS IS TESTING, and why it had to be a real page rather than an argument:

  The hero lens is framed by a marketplace in a SANDBOXED IFRAME AT AN OPAQUE ORIGIN. Our own
  authoring template (cards/hero/_template.html) says: no external requests, no localStorage
  (it THROWS), no window.parent, no injected wallet, and it must survive at ~300px wide.

  A PlayCanvas card cannot obey "inline everything" — the engine is 2.26 MB raw, and inlining
  it into 33 standalone cards would be ~74 MB. So the whole idea rests on ONE question: can a
  lens page load a SHARED engine over <script src> from our own host inside that frame?

  There is a proven precedent — on 2026-07-27 the renderer's animation_url made SuperRare's
  token page render the live SITE in its media slot, and the site loads external scripts. So
  the "inline everything" rule is us being conservative, not a measured limit. This page is
  how we find out for certain, cheaply, before anyone builds 33 of anything.

  ⚑ FAILS OPEN, and that is the actual product decision here: if the engine does not load —
  blocked, offline, no WebGL2 — the card falls back to a CSS 3D card that still tilts, still
  parallaxes its layers and still reads correctly. A collector never sees a broken frame, and
  a lens that degrades to something handsome is worth more than one that degrades to nothing.

  ⚠ Aspect trap, already paid for once: `height:100%` + `max-width:100%` makes `aspect-ratio`
    silently yield — measured 0.571 instead of 2:3 in a 320x560 phone slot. Paired
    min/max-aspect-ratio queries below, and it must be re-checked at 320px in a REAL frame.

  Type is Arial bold, all caps — the artist's meme font. It is also a system font, so it needs
  no external request and survives the sandbox where a webfont would not.
-->
<style>
  :root { --ink:#07070a; --hot:#ff2a6d; --cool:#27f7e4; --gold:#ffd23b; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;
            font-family:Arial,Helvetica,sans-serif;font-weight:700;
            -webkit-text-size-adjust:100%}
  /* the card box: 2:3, centred, and sized off whichever axis is actually the constraint */
  #stage{position:absolute;inset:0;display:grid;place-items:center}
  #card{position:relative;aspect-ratio:2/3;height:96%;width:auto;max-width:96%}
  @media (max-aspect-ratio:2/3){ #card{width:96%;height:auto;max-height:96%} }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3.4%}
  /* ── CSS fallback card — what a collector sees if the engine never arrives ── */
  #fb{position:absolute;inset:0;border-radius:3.4%;overflow:hidden;transform-style:preserve-3d;
      transition:transform .18s ease-out;background:#0b0b12;
      box-shadow:0 6% 12% rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.09) inset}
  #fb .lay{position:absolute;inset:-4%;background-size:cover;background-position:center;
           will-change:transform}
  #fb .glare{position:absolute;inset:0;mix-blend-mode:screen;opacity:.5;
             background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 48%,transparent 62%)}
  #fb .scan{position:absolute;inset:0;opacity:.16;pointer-events:none;
            background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
  #fb .frame{position:absolute;inset:2.6%;border:1px solid rgba(255,255,255,.22);border-radius:2.4%}
  #meta{position:absolute;left:9%;right:9%;bottom:4.2%;color:#fff;text-transform:uppercase;
        letter-spacing:.03em;text-shadow:0 .12em .3em rgba(0,0,0,.95);pointer-events:none}
  #ttl{font-size:4.4cqw;line-height:1.08}
  #sub{font-size:2.3cqw;opacity:.72;margin-top:.3em;font-weight:400;letter-spacing:.02em}
  #card{container-type:size}
  @supports not (width:1cqw){ #ttl{font-size:4.4vw} #sub{font-size:2.3vw} }
  #stats{position:absolute;left:9%;top:4.2%;color:#fff;font-size:2.4cqw;text-transform:uppercase;
         letter-spacing:.06em;text-shadow:0 .2em .4em #000;pointer-events:none}
  #badge{position:absolute;right:8%;top:4.2%;font-size:2.0cqw;padding:.35em .6em;border-radius:.4em;
         text-transform:uppercase;letter-spacing:.08em;color:#07070a;background:var(--gold)}
  #mode{position:absolute;left:0;right:0;bottom:.6%;text-align:center;font-size:9px;
        font-weight:400;letter-spacing:.12em;color:#5a6570;text-transform:uppercase}
</style>

<div id="stage"><div id="card">
  <div id="fb">
    <div class="lay" id="lbg"></div><div class="lay" id="lart"></div>
    <div class="scan"></div><div class="glare"></div><div class="frame"></div>
    <div id="badge">—</div>
    <div id="stats">—</div>
    <div id="meta"><div id="ttl">—</div><div id="sub">—</div></div>
  </div>
  <div id="mode">css fallback</div>
</div></div>

<script>
/* Card data. Fetched when we can reach it, but the page must still be a CARD if we cannot —
 * an opaque-origin frame with a hostile CSP is a real possibility, so the default is baked in
 * rather than left as an empty state. */
const DEFAULT = { slug:'bat-country', title:'Riviera Retiree', rarity:'common', atk:8, def:5,
                  trigger:'GAS STORM', omen:"We can't stop here. This is bat country.",
                  art:'art/bat-country.webp' };
const RARITY = { common:'#9fb2c4', uncommon:'#2bff80', rare:'#27f7e4', epic:'#b070ff', legendary:'#ffd23b' };
const qs = new URLSearchParams(location.search);
const $ = i => document.getElementById(i);
let CARD = DEFAULT, ART = null, tilt = { x:0, y:0 };

function paint(c) {
  $('ttl').textContent = (c.title||'').toUpperCase();
  $('sub').textContent = (c.omen||'').toUpperCase();
  $('stats').textContent = `ATK ${c.atk ?? '—'}   DEF ${c.def ?? '—'}` + (c.trigger?`   ◈ ${c.trigger}`:'');
  $('badge').textContent = (c.rarity||'').toUpperCase();
  $('badge').style.background = RARITY[c.rarity] || RARITY.common;
  const url = c.art ? new URL(c.art, location.href).href : null;
  if (url) { $('lart').style.backgroundImage = `url("${url}")`;
             $('lbg').style.backgroundImage = `url("${url}")`;
             $('lbg').style.filter = 'blur(2.2%) saturate(1.5) brightness(.5)'; ART = url; }
}
paint(CARD);

// same-origin-ish fetch; if the frame forbids it we simply keep the baked default
fetch(new URL('manifest.json', location.href).href).then(r => r.ok ? r.json() : null).then(m => {
  if (!m) return;
  const arr = Array.isArray(m) ? m : (m.cards || Object.values(m)[0]);
  if (!Array.isArray(arr)) return;
  const want = qs.get('card');
  const c = (want && arr.find(x => x.slug === want)) || arr.find(x => x.slug === DEFAULT.slug) || arr[0];
  if (c) { CARD = c; paint(c); if (window.__pcCard) window.__pcCard.retex(); }
}).catch(() => {});

/* ── tilt input ───────────────────────────────────────────────────────────────────────────
 * Pointer where there is one, device orientation on a phone. Both clamped, because the media
 * slot is small and a card that swings hard reads as broken rather than alive. */
addEventListener('pointermove', e => {
  const r = $('card').getBoundingClientRect();
  tilt.x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width  - .5) * 2));
  tilt.y = Math.max(-1, Math.min(1, ((e.clientY - r.top ) / r.height - .5) * 2));
}, { passive:true });
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  tilt.x = Math.max(-1, Math.min(1, e.gamma / 35));
  tilt.y = Math.max(-1, Math.min(1, ((e.beta || 0) - 45) / 35));
}, { passive:true });

// CSS fallback animation — runs until (unless) the engine takes over
let usingGL = false;
(function loop(){
  if (!usingGL) {
    const rx = -tilt.y * 11, ry = tilt.x * 13;
    $('fb').style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    $('lart').style.transform = `translate(${tilt.x*-2.2}%, ${tilt.y*-2.2}%) scale(1.04)`;
    $('lbg').style.transform  = `translate(${tilt.x*1.6}%, ${tilt.y*1.6}%) scale(1.08)`;
  }
  requestAnimationFrame(loop);
})();

/* ── the engine, if the sandbox allows it ────────────────────────────────────────────────
 * The whole experiment. A <script src> to our own host, loaded from inside whatever frame
 * this ends up in. If it lands we build a real lit 3D card; if it does not, nothing happens
 * and the CSS card above keeps running. `?nogl` forces the fallback so the degraded path can
 * be checked deliberately rather than only by accident. */
if (!qs.has('nogl')) {
  const s = document.createElement('script');
  s.src = new URL('../vendor/playcanvas/playcanvas.min.js', location.href).href;
  s.onload = () => { try { build3D(); } catch (e) { $('mode').textContent = 'css fallback (engine error)'; } };
  s.onerror = () => { $('mode').textContent = 'css fallback (engine blocked)'; };
  document.head.appendChild(s);
}

function build3D() {
  if (!window.pc) return;
  const cv = document.createElement('canvas');
  $('card').insertBefore(cv, $('fb'));
  const app = new pc.Application(cv, { graphicsDeviceOptions: { alpha:true, antialias:true } });
  if (!app.graphicsDevice) return;
  app.setCanvasFillMode(pc.FILLMODE_NONE);
  app.setCanvasResolution(pc.RESOLUTION_AUTO);
  const fit = () => { const r = $('card').getBoundingClientRect();
    // dpr capped: a card is small and every post pass scales with backing store
    app.graphicsDevice.maxPixelRatio = Math.min(devicePixelRatio || 1, 2);
    app.resizeCanvas(r.width, r.height); };
  fit(); addEventListener('resize', fit);

  const cam = new pc.Entity('cam');
  cam.addComponent('camera', { clearColor: new pc.Color(0.02,0.02,0.04,0), fov: 28 });
  cam.setPosition(0, 0, 3.4); app.root.addChild(cam);

  const key = new pc.Entity('key');
  key.addComponent('light', { type:'directional', color:new pc.Color(1,.96,.9), intensity:1.5,
                              castShadows:true, shadowBias:0.2, shadowResolution:1024 });
  key.setEulerAngles(52, 158, 0); app.root.addChild(key);   // raking, so the normal map has something to catch
  const rim = new pc.Entity('rim');
  rim.addComponent('light', { type:'omni', color:new pc.Color(.25,.9,1), intensity:2.4, range:9 });
  rim.setPosition(-1.8, 1.2, 1.6); app.root.addChild(rim);

  /* Depth is the entire point. A flat PNG on a tilting plane is still flat; SEPARATED layers
   * parallax against each other and that is what reads as three-dimensional. Three slabs at
   * different z, plus a thick card body with real edges catching the key light. */
  const root = new pc.Entity('card'); app.root.addChild(root);
  const W = 1.0, H = 1.5;

  const mkMat = (o) => { const m = new pc.StandardMaterial(); Object.assign(m, o); m.update(); return m; };
  const body = new pc.Entity('body');
  body.addComponent('render', { type:'box', castShadows:true, receiveShadows:true });
  body.setLocalScale(W*1.02, H*1.02, 0.035);
  body.render.material = mkMat({ diffuse:new pc.Color(.06,.06,.08), metalness:.35, gloss:.34, useMetalness:true });
  root.addChild(body);

  const plate = (z, sx, sy) => { const e = new pc.Entity();
    e.addComponent('render', { type:'plane', castShadows:false, receiveShadows:true });
    e.setLocalEulerAngles(90, 0, 0); e.setLocalScale(sx, 1, sy); e.setLocalPosition(0, 0, z);
    root.addChild(e); return e; };
  /* raised bevel — four thin boxes standing proud of the face. A drawn border is a picture of
   * an edge; this one occludes, shadows and catches the key light as the card turns. */
  const bev = (x0, y0, sx, sy) => { const e = new pc.Entity();
    e.addComponent('render', { type:'box', castShadows:true, receiveShadows:true });
    e.setLocalScale(sx, sy, 0.030); e.setLocalPosition(x0, y0, 0.038);
    e.render.material = mkMat({ diffuse:new pc.Color(.14,.14,.17), metalness:.85, gloss:.55,
                                useMetalness:true });
    root.addChild(e); return e; };
  const bw = 0.035, iw = W*0.955, ih = H*0.955;
  bev(0,  ih/2, iw + bw, bw); bev(0, -ih/2, iw + bw, bw);
  bev(-iw/2, 0, bw, ih + bw); bev( iw/2, 0, bw, ih + bw);

  const back = plate(0.019, W*0.99, H*0.99);
  const art  = plate(0.030, W*0.90, H*0.90);
  const fx   = plate(0.045, W*0.99, H*0.99);

  /* ── making it not flat ────────────────────────────────────────────────────────────────
   * First pass was a lit plane with the art painted on it, and it read exactly like that: a
   * picture, not an object. Three things fix it, and none needs authored input:
   *
   *   1. A NORMAL MAP DERIVED FROM THE ART ITSELF. Sobel the luminance and pack the gradient
   *      into a tangent-space normal. The artwork then has relief — ink sits proud, edges
   *      catch the key light, and the highlight travels across the drawing as the card turns.
   *      This is the single biggest change, and it costs one canvas pass at load.
   *   2. CARD STOCK. Real cards are not glass. A fine procedural grain in the normal, plus a
   *      gloss map that varies, so the surface has tooth instead of a uniform sheen.
   *   3. A RAISED BEVEL, as geometry rather than a drawn line — a border you can see the
   *      thickness of from an angle is what tells the eye this is a physical object.
   *
   * ⚑ Sobel strength is a real trade: too little and it stays flat, too much and the art turns
   *   into hammered metal and the drawing stops reading. 2.2 keeps the ink legible. */
  function normalFromImage(img, strength) {
    const W = 512, H = Math.round(W * img.height / img.width) || 512;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
    const src = x.getImageData(0, 0, W, H), d = src.data;
    const lum = new Float32Array(W * H);
    for (let i = 0, p = 0; i < d.length; i += 4, p++)
      lum[p] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255;
    const out = x.createImageData(W, H), o = out.data;
    const at = (px, py) => lum[Math.min(H-1,Math.max(0,py)) * W + Math.min(W-1,Math.max(0,px))];
    for (let y = 0; y < H; y++) for (let px = 0; px < W; px++) {
      // Sobel: horizontal and vertical luminance gradient
      const gx = (at(px+1,y-1) + 2*at(px+1,y) + at(px+1,y+1))
               - (at(px-1,y-1) + 2*at(px-1,y) + at(px-1,y+1));
      const gy = (at(px-1,y+1) + 2*at(px,y+1) + at(px+1,y+1))
               - (at(px-1,y-1) + 2*at(px,y-1) + at(px+1,y-1));
      // fine paper tooth, deterministic so the card is identical every load
      const grain = (Math.sin(px * 12.9898 + y * 78.233) * 43758.5453 % 1) * 0.06;
      let nx = -gx * strength + grain, ny = -gy * strength + grain, nz = 1;
      const L = Math.hypot(nx, ny, nz) || 1;
      const i = (y * W + px) * 4;
      o[i]   = (nx/L * 0.5 + 0.5) * 255;
      o[i+1] = (ny/L * 0.5 + 0.5) * 255;
      o[i+2] = (nz/L * 0.5 + 0.5) * 255;
      o[i+3] = 255;
    }
    x.putImageData(out, 0, 0);
    const t = new pc.Texture(app.graphicsDevice, { mipmaps:true });
    t.setSource(c); return t;
  }

  const texFor = (url, cb) => { const t = new pc.Texture(app.graphicsDevice, { mipmaps:true });
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => { t.setSource(img); cb(t, img); }; img.onerror = () => {}; img.src = url; };

  function retex() {
    if (!ART) return;
    texFor(ART, (t, img) => {
      let nrm = null;
      try { nrm = normalFromImage(img, 2.2); } catch (e) { nrm = null; }   // fail open: just flatter
      art.render.material = mkMat({ diffuseMap:t, normalMap:nrm, bumpiness:1.15,
        emissiveMap:t, emissive:new pc.Color(.13,.13,.13),
        gloss:.62, metalness:.10, useMetalness:true });
      back.render.material = mkMat({ diffuseMap:t, normalMap:nrm, bumpiness:.5,
        diffuse:new pc.Color(.16,.16,.2), gloss:.25 });
    });
  }
  retex(); window.__pcCard = { retex };

  /* ── holographic sweep ─────────────────────────────────────────────────────────────────
   * ⚑ Two bugs found by LOOKING at the first render, which came out uniformly magenta with
   *   the artwork barely readable underneath:
   *
   *   1. With BLEND_ADDITIVE, `opacity` does NOT attenuate the contribution — additive adds
   *      src to dst regardless, so an emissive colour set to (0.9, 0.5, 1.0) was being added
   *      at FULL strength across the whole card no matter how low opacity went. The amount
   *      has to be baked into the emissive colour itself.
   *   2. It was a flat plate, so the "sweep" tinted the entire face at once. Real foil is a
   *      narrow BAND that travels; a uniform wash just looks like the card is the wrong colour.
   *
   * So the band is a texture now — a diagonal gradient stripe, scrolled — and its strength
   * lives in the emissive colour. The art stays the subject; the foil is an event that
   * crosses it. */
  const bandTex = (() => {
    const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, S, S);
    const g = x.createLinearGradient(0, 0, S, S);
    g.addColorStop(0.00, 'rgba(0,0,0,0)');   g.addColorStop(0.40, 'rgba(0,0,0,0)');
    g.addColorStop(0.47, 'rgba(120,190,255,1)');
    g.addColorStop(0.50, 'rgba(255,255,255,1)');
    g.addColorStop(0.53, 'rgba(255,140,230,1)');
    g.addColorStop(0.60, 'rgba(0,0,0,0)');   g.addColorStop(1.00, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
    const t = new pc.Texture(app.graphicsDevice, { mipmaps:true,
      addressU: pc.ADDRESS_REPEAT, addressV: pc.ADDRESS_REPEAT });
    t.setSource(c); return t;
  })();
  const holo = mkMat({ diffuse:new pc.Color(0,0,0), emissiveMap:bandTex,
                       emissive:new pc.Color(.10,.10,.10),
                       blendType:pc.BLEND_ADDITIVE, depthWrite:false });
  fx.render.material = holo;

  const rar = RARITY[CARD.rarity] || RARITY.common;
  const rc = new pc.Color().fromString(rar);
  rim.light.color = new pc.Color(rc.r, rc.g, rc.b);

  let t = 0;
  app.on('update', dt => {
    t += dt;
    root.setLocalEulerAngles(-tilt.y * 13, tilt.x * 16, tilt.x * -2);
    // layers slide against each other by depth — the parallax that sells it
    art.setLocalPosition(tilt.x * -0.022, tilt.y * 0.022, 0.030);
    back.setLocalPosition(tilt.x * 0.016, tilt.y * -0.016, 0.019);
    /* Scroll the band across the face, and let TILT drive how hot it gets — foil catches
     * light when you move the card, which is the whole gesture we are imitating. Strength
     * goes in the emissive colour, never in opacity: additive ignores opacity. */
    holo.emissiveMapOffset = new pc.Vec2(-((t * 0.16) % 1), 0);
    const heat = 0.09 + 0.13 * Math.min(1, Math.hypot(tilt.x, tilt.y));
    holo.emissive = new pc.Color(heat, heat, heat);
    holo.update();
  });

  app.start();
  usingGL = true;
  $('fb').style.opacity = '0';                        // keep the DOM text: it is crisper than GL type
  $('fb').style.opacity = '';                          // ...so instead hide only the art layers
  $('lbg').style.display = $('lart').style.display = 'none';
  $('fb').style.background = 'transparent';
  $('fb').style.boxShadow = 'none';
  $('mode').textContent = 'playcanvas 3d · engine loaded';
}
</script>
