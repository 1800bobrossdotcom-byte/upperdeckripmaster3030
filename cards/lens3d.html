<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D CARD LENS — test</title>
<!--
  ripmaster3030studios — DYNAMIC 3D CARD, proof of concept.
  cards/lens3d.html?card=<slug>          (defaults to a test card)
  cards/lens3d.html?hero=NN              one of the artist's own cards
  cards/lens3d.html?demo                 the authored LAYERED demo (media/lens/demo)
  switches: ?nogl (force CSS)  ?nostate (no chain reads)  ?nolayers (force one flat plate)

  ── WHAT A LENS IS, in two halves ─────────────────────────────────────────────────────────
  DEPTH: a card is built from separated plates — backing, mid, subject, FX, foil — that slide
  against each other as it turns. Described by a sidecar next to the art (js/card-layers.js).
  ⛔ We do NOT segment flat art to fake this. Every card in the repo today is a single flat
     plate and renders as one; layers arrive when the artist authors them.
  LIVE: the card is a lens OVER SOMETHING — the $3030 edition's own market. Burn progress,
  price and liquidity are read over a public RPC (js/lens-state.js) and drive the light, the
  parallax and the foil. Read-only. No wallet, ever, for the reason below.

  WHAT THIS IS TESTING, and why it had to be a real page rather than an argument:

  The hero lens is framed by a marketplace in a SANDBOXED IFRAME AT AN OPAQUE ORIGIN. Our own
  authoring template (cards/hero/_template.html) says: no external requests, no localStorage
  (it THROWS), no window.parent, no injected wallet, and it must survive at ~300px wide.

  A PlayCanvas card cannot obey "inline everything" — the engine is 2.26 MB raw, and inlining
  it into 33 standalone cards would be ~74 MB. So the whole idea rests on ONE question: can a
  lens page load a SHARED engine over <script src> from our own host inside that frame?

  There is a proven precedent — on 2026-07-27 the renderer's animation_url made SuperRare's
  token page render the live SITE in its media slot, and the site loads external scripts. So
  the "inline everything" rule is us being conservative, not a measured limit. This page is
  how we find out for certain, cheaply, before anyone builds 33 of anything.

  ⚑ FAILS OPEN, and that is the actual product decision here: if the engine does not load —
  blocked, offline, no WebGL2 — the card falls back to a CSS 3D card that still tilts, still
  parallaxes its layers and still reads correctly. A collector never sees a broken frame, and
  a lens that degrades to something handsome is worth more than one that degrades to nothing.

  ⚠ Aspect trap, already paid for once: `height:100%` + `max-width:100%` makes `aspect-ratio`
    silently yield — measured 0.571 instead of 2:3 in a 320x560 phone slot. Paired
    min/max-aspect-ratio queries below, and it must be re-checked at 320px in a REAL frame.

  Type is Arial bold, all caps — the artist's meme font. It is also a system font, so it needs
  no external request and survives the sandbox where a webfont would not.
-->
<style>
  :root { --ink:#07070a; --hot:#ff2a6d; --cool:#27f7e4; --gold:#ffd23b; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;
            font-family:Arial,Helvetica,sans-serif;font-weight:700;
            -webkit-text-size-adjust:100%}
  /* the card box: 2:3, centred, and sized off whichever axis is actually the constraint */
  #stage{position:absolute;inset:0;display:grid;place-items:center}
  #card{position:relative;aspect-ratio:2/3;height:96%;width:auto;max-width:96%}
  @media (max-aspect-ratio:2/3){ #card{width:96%;height:auto;max-height:96%} }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3.4%}
  /* ── CSS fallback card — what a collector sees if the engine never arrives ── */
  #fb{position:absolute;inset:0;border-radius:3.4%;overflow:hidden;transform-style:preserve-3d;
      transition:transform .18s ease-out;background:#0b0b12;
      box-shadow:0 6% 12% rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.09) inset}
  #fb .lay{position:absolute;inset:-4%;background-size:cover;background-position:center;
           will-change:transform}
  /* ⚑ THE FALLBACK IS LAYERED TOO. If the engine never arrives, an authored layered card should
     still be a layered card — the same plates, parallaxed with transforms instead of geometry.
     A lens that degrades to something handsome is worth more than one that degrades to nothing,
     and degrading a five-plate card to one flat plate would throw away the artist's work. */
  #flay{position:absolute;inset:0;transform-style:preserve-3d}
  #flay .fl{position:absolute;inset:-5%;background-size:contain;background-repeat:no-repeat;
            background-position:center;will-change:transform}
  #flay .fl.full{background-size:cover}
  #flay .fl.add{mix-blend-mode:screen}
  #fb .glare{position:absolute;inset:0;mix-blend-mode:screen;opacity:.5;
             background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 48%,transparent 62%)}
  #fb .scan{position:absolute;inset:0;opacity:.16;pointer-events:none;
            background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
  #fb .frame{position:absolute;inset:2.6%;border:1px solid rgba(255,255,255,.22);border-radius:2.4%}
  #meta{position:absolute;left:9%;right:9%;bottom:4.2%;color:#fff;text-transform:uppercase;
        letter-spacing:.03em;text-shadow:0 .12em .3em rgba(0,0,0,.95);pointer-events:none}
  #ttl{font-size:4.4cqw;line-height:1.08}
  #sub{font-size:2.3cqw;opacity:.72;margin-top:.3em;font-weight:400;letter-spacing:.02em}
  #card{container-type:size}
  @supports not (width:1cqw){ #ttl{font-size:4.4vw} #sub{font-size:2.3vw} }
  #stats{position:absolute;left:9%;top:4.2%;color:#fff;font-size:2.4cqw;text-transform:uppercase;
         letter-spacing:.06em;text-shadow:0 .2em .4em #000;pointer-events:none}
  /* the live market readout. Hidden until a read actually succeeds — a dash where a number
     should be is honest; a zero is a claim. */
  #live{position:absolute;left:9%;top:9.4%;color:#27f7e4;font-size:1.9cqw;font-weight:400;
        letter-spacing:.08em;text-transform:uppercase;text-shadow:0 .2em .4em #000;
        pointer-events:none;display:none;line-height:1.5}
  #live b{color:#ffd23b;font-weight:700}
  #badge{position:absolute;right:8%;top:4.2%;font-size:2.0cqw;padding:.35em .6em;border-radius:.4em;
         text-transform:uppercase;letter-spacing:.08em;color:#07070a;background:var(--gold)}
  #mode{position:absolute;left:0;right:0;bottom:.6%;text-align:center;font-size:9px;
        font-weight:400;letter-spacing:.12em;color:#5a6570;text-transform:uppercase}
</style>

<div id="stage"><div id="card">
  <div id="fb">
    <div class="lay" id="lbg"></div><div class="lay" id="lart"></div>
    <!-- authored layers land here when a card has them; empty for every card today -->
    <div id="flay"></div>
    <div class="scan"></div><div class="glare"></div><div class="frame"></div>
    <div id="badge">—</div>
    <div id="stats">—</div>
    <div id="live"></div>
    <div id="meta"><div id="ttl">—</div><div id="sub">—</div></div>
  </div>
  <div id="mode">css fallback</div>
</div></div>

<script>
/* Card data. Fetched when we can reach it, but the page must still be a CARD if we cannot —
 * an opaque-origin frame with a hostile CSP is a real possibility, so the default is baked in
 * rather than left as an empty state. */
const DEFAULT = { slug:'bat-country', title:'Riviera Retiree', rarity:'common', atk:8, def:5,
                  trigger:'GAS STORM', omen:"We can't stop here. This is bat country.",
                  art:'art/bat-country.webp' };
const RARITY = { common:'#9fb2c4', uncommon:'#2bff80', rare:'#27f7e4', epic:'#b070ff', legendary:'#ffd23b' };
/* The authored LAYERED demo. Not a card in either deck — it is the reference implementation of
 * the layer schema, baked by scripts/build-lens-demo.mjs, and it exists so the renderer can be
 * proven against real separated plates instead of against segmented flat art. */
const DEMO = { slug:'lens-demo', title:'Depth Test', rarity:'prizm', atk:null, def:null,
               trigger:null, omen:'five plates, one card', art:'../media/lens/demo/flat.webp',
               layers:'../media/lens/demo/demo.layers.json',
               /* ⛔ The badge says DEMO, not a rarity. `rarity` here only picks the rim colour;
                * printing "PRIZM" on it would dress a test plate as a collectible, and the
                * artist's 100 cards are the artist's to name and to rank. */
               badge:'DEMO' };
const qs = new URLSearchParams(location.search);
const $ = i => document.getElementById(i);
let CARD = DEFAULT, ART = null, tilt = { x:0, y:0 };
let SPEC = null;            // the normalised layer spec, or null — null is the normal case
let DRIVERS = null;         // the live market dials, or null until a read lands
/* ⚠ DECLARED UP HERE ON PURPOSE. `?demo` adopts its card on the very first statement of this
 * script, which reaches pushLayers(), which asks whether GL has taken over — and a `let` further
 * down the file is in its temporal dead zone at that moment. It threw, which killed the whole
 * script and left the page as a bare CSS card with no layers and no state: a total failure that
 * looked exactly like a successful fallback. Order matters more than tidiness here. */
let usingGL = false;

function paint(c) {
  $('ttl').textContent = (c.title||'').toUpperCase();
  $('sub').textContent = (c.omen||'').toUpperCase();
  const hasStats = c.atk != null || c.def != null;
  $('stats').textContent = hasStats
    ? `ATK ${c.atk ?? '—'}   DEF ${c.def ?? '—'}` + (c.trigger ? `   ◈ ${c.trigger}` : '')
    : 'RIPMASTER3030STUDIOS';
  $('badge').textContent = c.badge ? c.badge
                                   : c.rarity ? c.rarity.toUpperCase()
                                   : (c.number != null ? '#' + String(c.number).padStart(2,'0') : '');
  $('badge').style.background = RARITY[c.rarity] || '#ffd23b';
  $('badge').style.display = $('badge').textContent ? '' : 'none';
  const url = c.art ? new URL(c.art, location.href).href : null;
  if (url) { $('lart').style.backgroundImage = `url("${url}")`;
             $('lbg').style.backgroundImage = `url("${url}")`;
             $('lbg').style.filter = 'blur(2.2%) saturate(1.5) brightness(.5)'; ART = url; }
}
paint(CARD);

/* ── which card ──────────────────────────────────────────────────────────────────────────────
 * Each of these is best-effort. Whatever resolves last wins, and if none of them resolve the
 * baked DEFAULT is still a complete card. `use()` is the single place a new card is adopted, so
 * the layer sidecar and the renderer can never disagree about which card is on screen. */
function use(c) {
  CARD = c; paint(c);
  loadLayers().then(() => { if (window.__pcCard) window.__pcCard.retex(); });
}

if (qs.has('demo')) use(DEMO);

/* ?hero=NN — the artist's OWN cards (34-49), which have a number and a title but none of the
 * placeholder deck's invented stats. Rarity is left off rather than fabricated: showing a made-up
 * ATK on real artwork would be inventing canon, and these cards' stats are the artist's to set. */
fetch(new URL('hero-manifest.json', location.href).href).then(r => r.ok ? r.json() : null).then(list => {
  const n = parseInt(qs.get('hero'), 10);
  if (!list || !n) return;
  const h = list.find(c => c.number === n);
  if (!h) return;
  use({ slug:'hero-' + n, title:h.title, rarity:null, atk:null, def:null,
        trigger:null, omen:'', art:h.art, number:h.number, layers:h.layers || null });
}).catch(() => {});

// same-origin-ish fetch; if the frame forbids it we simply keep the baked default
if (!qs.has('hero') && !qs.has('demo')) fetch(new URL('manifest.json', location.href).href).then(r => r.ok ? r.json() : null).then(m => {
  if (!m) return;
  const arr = Array.isArray(m) ? m : (m.cards || Object.values(m)[0]);
  if (!Array.isArray(arr)) return;
  const want = qs.get('card');
  const c = (want && arr.find(x => x.slug === want)) || arr.find(x => x.slug === DEFAULT.slug) || arr[0];
  if (c) use(c);
}).catch(() => {});

/* ── the layer sidecar ───────────────────────────────────────────────────────────────────────
 * ⚑ RESOLVING TO null IS THE NORMAL ANSWER, not a failure — 196 placeholder cards and every
 *   hero scan are single flat plates, and they must render exactly as they render today. The
 *   layered path only ever switches on for a card whose artist authored one. */
function loadLayers() {
  SPEC = null;
  if (qs.has('nolayers') || !window.CardLayers || !ART) { pushLayers(); return Promise.resolve(null); }
  const url = CARD.layers ? new URL(CARD.layers, location.href).href : null;
  return CardLayers.load(ART, url ? { url } : undefined)
    .then(spec => { SPEC = spec; pushLayers(); return spec; })
    .catch(() => { pushLayers(); return null; });
}

/* Mirror the stack into the CSS card as well, so the fallback is layered too. Cheap: five divs
 * with background-images that the tilt loop translates. */
function pushLayers() {
  const host = $('flay'); if (!host) return;
  host.textContent = '';
  /* ⚠ ONCE GL IS UP THE CSS PLATES STAY HIDDEN. This function can run again later — a manifest
   *   resolving after the engine did — and re-showing #lbg/#lart would put the fallback's
   *   painted layers back on top of the render. That is a cousin of THE WASH: decorative CSS
   *   sitting over the canvas, measured once as saturation 19.9% -> 12.7%. */
  if (usingGL) { host.style.display = 'none'; if (window.__pcCard) window.__pcCard.relayer(); return; }
  const deco = ['.glare', '.scan'].map(s => document.querySelector('#fb ' + s));
  if (!SPEC) {
    $('lbg').style.display = $('lart').style.display = '';
    deco.forEach(e => { if (e) e.style.display = ''; });
    return;
  }
  $('lbg').style.display = $('lart').style.display = 'none';
  /* An authored foil layer replaces the fallback's own .glare and .scan, for the same reason the
   * GL path switches its generated sweep off: two foils on one card reads as a rendering bug. */
  deco.forEach(e => { if (e) e.style.display = 'none'; });
  SPEC.layers.forEach(L => {
    const d = document.createElement('div');
    d.className = 'fl' + (L.fit === 'full' ? ' full' : '') + (L.blend === 'add' ? ' add' : '');
    d.style.backgroundImage = `url("${L.src}")`;
    /* ⚑ A PLATE WITH A `rect` IS PLACED, NOT STRETCHED. `.fl`'s default is `inset:-5%` with
     * background-size contain/cover — right for a full-bleed plate, and a lie for a trimmed
     * cut-out, which is what every generated separation is. Card 42's title badge is 17% of the
     * card wide; drawn at the face it spanned the whole top edge. The rect overrides all four
     * offsets AND the sizing, so the box IS the plate and the image fills it exactly. */
    if (L.rect) {
      d.style.left = (L.rect[0] * 100) + '%';  d.style.top = (L.rect[1] * 100) + '%';
      d.style.width = (L.rect[2] * 100) + '%'; d.style.height = (L.rect[3] * 100) + '%';
      d.style.right = 'auto'; d.style.bottom = 'auto';
      d.style.backgroundSize = '100% 100%';
    }
    d.dataset.par = L.par;
    d.dataset.add = L.blend === 'add' ? '1' : '';
    d.dataset.op = L.opacity;
    if (L.drive) { d.dataset.gain = L.drive.gain; d.dataset.gmin = L.drive.min;
                   d.dataset.gmax = L.drive.max; d.dataset.grest = L.drive.rest; }
    host.appendChild(d);
  });
  if (window.__pcCard) window.__pcCard.relayer();
}

/* ── live market state ───────────────────────────────────────────────────────────────────────
 * ⛔ READ-ONLY, AND THAT IS NOT NEGOTIABLE. This page is what a token's animation_url frames.
 *    SuperRare's security team flagged an embed that touches a wallet and they were right: a
 *    frame that asks for a wallet is indistinguishable from one that has been swapped for a
 *    malicious frame. `eth_call` over `fetch` can show state and cannot move anything.
 * ⚠ And it may simply be blocked. Every failure path lands on the same neutral dials, which are
 *   the values the card was tuned at — so "no network" looks like the card, not like a bug. */
function startState() {
  if (qs.has('nostate') || !window.LensState) return;
  LensState.watch((st, dr) => {
    DRIVERS = dr;
    paintState(st, dr);
    if (window.__pcCard) window.__pcCard.state(dr);
  }, { every: 60000 });
}

function paintState(st, dr) {
  const el = $('live'); if (!el) return;
  if (!st || !st.live) { el.style.display = 'none'; return; }
  const rows = [`burned <b>${Math.round(st.burned).toLocaleString()}</b> / ${Math.round(st.maxSupply).toLocaleString()}`];
  /* ⚑ Price only appears when the read PROVED its own word order (1.0001^tick == tokenPerRare).
   *   getMarketState()'s layout is unverified on the real mainnet edition and CLAUDE.md says it
   *   can drift; a silently transposed word would put a 280x-wrong price on a collector's card. */
  if (st.orderOk && st.rarePerToken) rows.push(`<b>${st.rarePerToken.toFixed(3)}</b> rare / 3030`);
  el.innerHTML = rows.join('<br>');
  /* ⚠ 'block', NOT ''. Clearing an inline style does not mean "visible" — it hands the element
   *   back to the stylesheet, and the stylesheet says `display:none`. Measured: the readout was
   *   populated with correct live numbers and never appeared once. Same family as the
   *   `display:inline-block` vs `[hidden]` trap already in CLAUDE.md — any rule that sets
   *   `display` has to be undone by naming a value, not by erasing one. */
  el.style.display = 'block';
}

/* ── tilt input ───────────────────────────────────────────────────────────────────────────
 * Pointer where there is one, device orientation on a phone. Both clamped, because the media
 * slot is small and a card that swings hard reads as broken rather than alive. */
addEventListener('pointermove', e => {
  const r = $('card').getBoundingClientRect();
  tilt.x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width  - .5) * 2));
  tilt.y = Math.max(-1, Math.min(1, ((e.clientY - r.top ) / r.height - .5) * 2));
}, { passive:true });
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  tilt.x = Math.max(-1, Math.min(1, e.gamma / 35));
  tilt.y = Math.max(-1, Math.min(1, ((e.beta || 0) - 45) / 35));
}, { passive:true });

// CSS fallback animation — runs until (unless) the engine takes over (`usingGL` is declared above)
(function loop(){
  if (!usingGL) {
    const rx = -tilt.y * 11, ry = tilt.x * 13;
    /* market depth becomes visual depth here too, so the fallback tells the same story as the
       renderer — 1.0 exactly when there is no live read, which is the tuned baseline */
    const g = DRIVERS && DRIVERS.live ? 0.70 + 0.60 * DRIVERS.depth : 1;
    $('fb').style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    $('lart').style.transform = `translate(${tilt.x*-2.2*g}%, ${tilt.y*-2.2*g}%) scale(1.04)`;
    $('lbg').style.transform  = `translate(${tilt.x*1.6*g}%, ${tilt.y*1.6*g}%) scale(1.08)`;
    const fl = $('flay').children;
    for (let i = 0; i < fl.length; i++) {
      const ds = fl[i].dataset, p = parseFloat(ds.par) * g;
      fl[i].style.transform = `translate(${tilt.x*-2.4*p}%, ${tilt.y*-2.4*p}%) translateZ(${p*14}px)`;
      /* The same `drive` the renderer applies, so a card driven by the market still is one when
       * the engine never arrived. ⚠ ×2.6 because these are not the same operation: GL adds an
       * emissive colour, CSS screen-blends a whole plate, and an additive layer authored at 0.15
       * emissive is invisible as a 0.15-opacity screen. Matched by eye against the GL card —
       * a conversion factor, not a coincidence. */
      if (ds.add) {
        const v = (DRIVERS && DRIVERS.live && ds.gain) ? DRIVERS[ds.gain] : null;
        const gain = ds.gmin === undefined ? 1
                   : v === null || v === undefined ? +ds.grest
                   : +ds.gmin + (+ds.gmax - +ds.gmin) * v;
        fl[i].style.opacity = String(Math.max(0.04, Math.min(1, gain * 2.6)));
      } else fl[i].style.opacity = ds.op || '1';
    }
  }
  requestAnimationFrame(loop);
})();

/* ── the engine, if the sandbox allows it ────────────────────────────────────────────────
 * The whole experiment. A <script src> to our own host, loaded from inside whatever frame
 * this ends up in. If it lands we build a real lit 3D card; if it does not, nothing happens
 * and the CSS card above keeps running. `?nogl` forces the fallback so the degraded path can
 * be checked deliberately rather than only by accident.
 *
 * The card itself is js/card3d.js — the SAME module the folder's starfield viewer uses. It
 * lived inline here first, and the moment a second page wanted the same card there were two
 * copies of the colour-management fix, which is two chances to lose it. */
function loadScript(rel) {
  return new Promise(res => {
    const s = document.createElement('script');
    s.src = new URL(rel, location.href).href;
    s.onload = () => res(true); s.onerror = () => res(false);   // resolve either way; never reject
    document.head.appendChild(s);
  });
}

/* The helpers are INDEPENDENTLY optional. chain-config supplies the edition address and the RPC
 * list (never duplicated here — a second copy of an address is a second thing to drift);
 * lens-state does the reads; card-layers parses the sidecar; gfx-post is loaded only for
 * `dprCap()`, because "what counts as a weak device" must have exactly one definition and this
 * page is the one most likely to open in a phone's media slot. Any of them missing just removes
 * that capability. */
Promise.all(['../js/chain-config.js', '../js/lens-state.js', '../js/card-layers.js', '../js/gfx-post.js']
              .map(loadScript))
  .then(() => { startState(); return loadLayers(); })
  .catch(() => {});

if (!qs.has('nogl')) {
  const s = document.createElement('script');
  s.src = new URL('../js/card3d.js', location.href).href;
  s.onload = () => Card3D.engine('../')
    .then(() => { try { build3D(); } catch (e) { $('mode').textContent = 'css fallback (engine error)'; } })
    .catch(() => { $('mode').textContent = 'css fallback (engine blocked)'; });
  s.onerror = () => { $('mode').textContent = 'css fallback (module blocked)'; };
  document.head.appendChild(s);
}

function build3D() {
  if (!window.pc || !window.Card3D) return;
  const cv = document.createElement('canvas');
  $('card').insertBefore(cv, $('fb'));
  const ctrl = Card3D.build({
    canvas: cv, box: $('card'), tilt: () => tilt,
    /* An environment for the raised metal bevel to reflect. A metal edge with nothing to
     * reflect is just a grey edge, which is how the first pass read. Optional and quiet:
     * blocked or missing, the card is still lit by its own key and rim. */
    env: new URL('../models/env/satara_night.png', location.href).href,
  });
  if (!ctrl) { $('mode').textContent = 'css fallback (no webgl)'; return; }
  ctrl.setArt(ART); ctrl.setRarity(CARD.rarity);
  ctrl.setLayers(SPEC);                       // null for every card today — the flat plate
  if (DRIVERS) ctrl.setState(DRIVERS);        // else the tuned resting values stand
  const mode = () => { $('mode').textContent =
    'playcanvas 3d · ' + (SPEC ? SPEC.layers.length + ' layers' : 'flat plate')
    + (DRIVERS && DRIVERS.live ? ' · live' : ''); };
  window.__pcCard = {
    retex:   () => { ctrl.setArt(ART); ctrl.setRarity(CARD.rarity); ctrl.setLayers(SPEC); mode(); },
    relayer: () => { ctrl.setLayers(SPEC); mode(); },
    state:   d  => { ctrl.setState(d); mode(); },
    ctrl
  };
  usingGL = true;

  /* ⚑ THE WASH. This is what made the cards read "diminished in colour with flatness".
   * The CSS fallback is kept in the DOM because its TEXT is crisper than anything GL can draw
   * at this size — but the fallback also carries a .glare (white diagonal, opacity .5,
   * mix-blend-mode: screen) and a .scan (white lines, opacity .16), and those were still sitting
   * ON TOP of the canvas. Screen-blending white over the render lifts every black and drags
   * saturation out of everything — measured on card 45 as saturation 19.9% -> 12.7%, contrast
   * 71.5 -> 59.3, blacks 6.7% -> 0.9% of the frame.
   * The sRGB texture format was a real fix too and it stays. But this was the bigger half, and
   * it was hiding in the FALLBACK rather than in the renderer, which is why looking at the
   * shader kept coming up empty. Only the type survives; every decorative CSS layer goes. */
  $('lbg').style.display = $('lart').style.display = 'none';
  $('flay').style.display = 'none';                    // GL draws the stack; the CSS copy stands down
  ['.scan', '.glare', '.frame'].forEach(sel => {
    const el = document.querySelector('#fb ' + sel); if (el) el.style.display = 'none'; });
  $('fb').style.background = 'transparent';
  $('fb').style.boxShadow = 'none';
  $('fb').style.transform = 'none';                    // GL owns the tilt now; do not double it
  $('mode').textContent = 'playcanvas 3d \u00b7 ' + (SPEC ? SPEC.layers.length + ' layers' : 'flat plate');
}
</script>
